name: Auto-Create ACD Issues

on:
  schedule:
    # Every Saturday at 09:00 UTC
    - cron: '0 9 * * 6'
  workflow_dispatch:
    # Manual triggering with optional inputs
    inputs:
      call_type:
        description: 'Call type (leave empty for both ACDE and ACDC)'
        required: false
        type: choice
        options:
          - ''
          - acde
          - acdc
      dry_run:
        description: 'Dry run (print what would be created without creating)'
        required: false
        type: boolean
        default: false

# Issue creation is authenticated with ACD_ISSUE_CREATION_TOKEN, a PAT with
# `repo` scope (an issue created via GITHUB_TOKEN does not trigger downstream
# workflows, so ACDbot would never pick it up). The job itself therefore only
# needs read access to check out the script.
permissions:
  contents: read

jobs:
  auto-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto-create script
        env:
          ACD_ISSUE_CREATION_TOKEN: ${{ secrets.ACD_ISSUE_CREATION_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ inputs.call_type }}" ]; then
            ARGS="$ARGS --type ${{ inputs.call_type }}"
          fi
          python3 .github/scripts/auto-create-acd-issue.py $ARGS
